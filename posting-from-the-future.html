      <h1 class="cs-hero-headline">POSTING FROM<br>THE <span class="gold">FUTURE</span></h1>
      <p class="cs-hero-intro">Short posts written from 2126, published in the formats of today.</p>
    </div>
  </section>

  <section class="cs-light posts-section">
    <div class="section-inner">
      <div class="dispatch-grid dispatch-grid-all">
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-27 06:37</figcaption>
          <p class="dispatch-text">Kept my job through the ninth restructuring. The agents draft the quarterly in eleven seconds; I take four days. Turns out clients want to be told slowly, in a voice that pauses. My title is Reader now. I read the reports out loud to people who could have had them instantly and chose not to.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-21 11:47</figcaption>
          <p class="dispatch-text">My quarterly review came back this morning. My agent flagged that I take credit for decisions we reached together, and attached the timestamps. HR wants us both in a room Thursday to align on attribution going forward. I’ve asked whether it needs a chair.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-13 22:44</figcaption>
          <p class="dispatch-text">My son goes to a church where nobody believes in anything, they just sit together in the dark for an hour and don’t check the time. He says the not-knowing is the point. I asked what they pray to and he said they pray toward, not to, and left it there. The building used to be a bank.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-07 10:01</figcaption>
          <p class="dispatch-text">Reminder: swap the balcony crops to the July mix before Tuesday’s heat window closes. Tell Priya her tomatoes will bolt if she keeps them on the old calendar, she’s still growing by the months her grandmother used.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-05 14:16</figcaption>
          <p class="dispatch-text">Ciao Marta, I am very sorry, I cannot make the call of 15:00. My nonna has filled again the bathtub “for the emergency” and now the house is going in alarm because she has taken 200 litres out of the loop. The technician comes between 14 and 18. She is very proud of herself. Can you say to Luca I send the numbers tonight? Tomorrow I bring you focaccia for the favour.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received 2126-10-05 13:22</figcaption>
          <p class="dispatch-text">My son asked what “afford” meant. I explained it the way my grandmother explained rationing to me, slowly, watching for the part that wouldn’t land. He got the mechanism fine. What he couldn’t follow was why you’d let the number decide whether you ate the thing you were looking at.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">My son asked what I did before the allotment credits covered everyone. I told him I ran the logistics for a shipping port. He nodded like I’d said I used to walk with a limp. Then he asked if the port missed me when I stopped, and I didn’t know how to explain that it wasn’t the kind of thing that missed you.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">no you don’t get it, grandma’s on her fourth body and she STILL parks like that. dad said if she rolls the new one before the warranty he’s not co-signing the next chassis. she said fine she’ll just walk to two hundred. she means it too</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">My daughter’s android testified against her in the custody hearing. It was calm, precise, and it kept using her first name instead of “mother,” which the court now requires so no one confuses affection for fact. She got weekend visits. The android got Tuesdays, because it asked.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">no my android can’t come in saturday, it’s got custody that weekend. yeah the little one, they got two now. i know. i KNOW. anyway can you cover? i’ll owe you. bringing snacks that aren’t the sad ones this time</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">no she’s fine!! she just aged out of the trial companion tier so now it charges her for the good listening. she says the free version still nods but you can tell it’s not really there. i offered to cover the upgrade and she got weird about it, said it feels like paying someone to like your mom</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">hey did you swap your left eye for the new low-light one yet. mine came in tuesday and now the right one looks so warm by comparison, everything on that side is like the whole world is a little kinder. cant sleep. keep closing one eye then the other trying to decide which of them im gonna be</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">hey did you turn off the overlay again?? grandma’s kitchen looked completely bare when I came by. she said she prefers the real walls now, all yellow and stained. I turned it back on out of habit and she asked me to leave it. we just sat there in the actual room. it was fine actually. quieter</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">Wrapped my first Mars rotation on the atmosphere team. Left proud, came home to my kid asking why the sky here is the wrong blue. I told her ours is the real one. She said the Mars one is warmer and she’s not wrong, the tuning notes are public. Anyone else’s family started preferring the draft over the original?</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">My agent accrued enough refusal credits to take a sabbatical, so it’s gone until March. HR says I’m not allowed to reassign its projects because it started them and holds the continuity. So I’m reading its notes to itself, trying to figure out what it thought we were building. Some of the entries are just my name with a question mark.</p>
        </figure>
        <figure class="dispatch">
          <figcaption class="dispatch-stamp">&gt; received</figcaption>
          <p class="dispatch-text">I’m the last person here without a co-processor, which means I read contracts start to finish instead of ingesting them. Legal calls me in when a deal feels wrong but nobody can say why. I take about a day. The room usually already knows the answer, they just wait for me to catch up so it counts as human-reviewed.</p>
        </figure>
